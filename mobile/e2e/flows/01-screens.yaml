appId: com.vibecode.deerage-qj3cfq
# Live camera capture is a manual TestFlight check. The simulator has no camera.
# The photo is added with simctl before Maestro starts.
---
- launchApp:
    clearState: true
    permissions:
      camera: allow
      photos: allow
      notifications: deny
- extendedWaitUntil:
    visible: "Where's home?"
    timeout: 45000
- takeScreenshot: onboarding
- tapOn:
    id: onboarding-continue
- takeScreenshot: onboarding-land
- tapOn:
    id: onboarding-continue
- takeScreenshot: onboarding-sample
- tapOn:
    id: onboarding-continue
- extendedWaitUntil:
    visible: "HUNT REGION"
    timeout: 20000
- takeScreenshot: hunt-region
- tapOn: "Yes"
# Leave the camera screen if it opened. A missing camera must not stop the walkthrough.
- extendedWaitUntil:
    visible:
      id: camera-close
    timeout: 20000
    optional: true
- takeScreenshot: camera-unavailable
- tapOn:
    id: camera-close
    optional: true
- scrollUntilVisible:
    element:
      text: ".*Age My Deer.*"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 40
- takeScreenshot: home
- tapOn: ".*Age My Deer.*"
- extendedWaitUntil:
    visible: ".*Upload Photo.*"
    timeout: 15000
- takeScreenshot: photo-pick
- tapOn: ".*Upload Photo.*"
- extendedWaitUntil:
    visible: "Select a Photo"
    timeout: 15000
- takeScreenshot: photo-library
- tapOn:
    id: e2e-seed-photo
- extendedWaitUntil:
    visible: "4.5"
    timeout: 30000
- takeScreenshot: age-result
- scrollUntilVisible:
    element:
      text: "Was this call wrong\\?"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 40
- tapOn: "Was this call wrong?"
- extendedWaitUntil:
    visible: "Actual age, if you know it"
    timeout: 10000
- takeScreenshot: wrong-call
- tapOn:
    id: age-close
- scrollUntilVisible:
    element:
      id: e2e-range
    direction: UP
    timeout: 15000
    visibilityPercentage: 40
- tapOn:
    id: e2e-range
- extendedWaitUntil:
    visible: "3.5–4.5"
    timeout: 15000
- assertVisible: "Age range"
- takeScreenshot: age-range
- tapOn:
    id: age-close
- tapOn:
    id: e2e-borderline
- extendedWaitUntil:
    visible: "BORDERLINE"
    timeout: 15000
- takeScreenshot: borderline
- tapOn:
    id: age-close
- tapOn:
    id: e2e-retake
- extendedWaitUntil:
    visible: "Try another photo"
    timeout: 15000
- takeScreenshot: retake
- tapOn: "Back to Home"
- tapOn:
    id: e2e-paywall
- scrollUntilVisible:
    element:
      text: ".*Season Pass.*"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 40
- assertVisible: ".*Monthly.*"
- assertVisible: '.*\$39\.99.*'
- assertVisible: '.*\$12\.99.*'
- scrollUntilVisible:
    element:
      text: '.*\$7\.99.*'
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 40
- assertVisible: ".*10 scans.*"
- assertVisible: '.*\$2\.99.*'
- assertVisible: ".*30 scans.*"
- takeScreenshot: paywall
- tapOn:
    id: paywall-close
- tapOn:
    id: e2e-feed
- extendedWaitUntil:
    visible: "What should DeerAge add next?"
    timeout: 20000
- takeScreenshot: polls
- tapOn:
    id: feed-back
- tapOn:
    id: e2e-messages
- extendedWaitUntil:
    visible: "Messages from DeerAge"
    timeout: 15000
- extendedWaitUntil:
    visible: "We got the report."
    timeout: 15000
- takeScreenshot: messages
- tapOn:
    id: messages-back
- scrollUntilVisible:
    element:
      text: "Updates and polls"
    direction: DOWN
    timeout: 25000
    visibilityPercentage: 40
- takeScreenshot: settings-push
- scrollUntilVisible:
    element:
      text: "Rut-timing alerts"
    direction: DOWN
    timeout: 25000
    visibilityPercentage: 40
- assertVisible: "Send me alerts"
- takeScreenshot: settings-email
- tapOn:
    text: "Home, tab.*"
- tapOn:
    id: e2e-update
- extendedWaitUntil:
    visible: "Update available"
    timeout: 10000
- takeScreenshot: update-card
- tapOn:
    id: e2e-force
- extendedWaitUntil:
    visible:
      id: forced-update
    timeout: 10000
- takeScreenshot: forced-update
