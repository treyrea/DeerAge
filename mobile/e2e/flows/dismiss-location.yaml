appId: com.vibecode.deerage-qj3cfq
# The age result asks for a stand location. That system sheet hides every
# control behind it, including the age the flows assert. Decline it when it
# is up. A build that never asks continues immediately.
---
- extendedWaitUntil:
    visible: "Don.*t Allow"
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible: "Don.*t Allow"
    commands:
      - tapOn: "Don.*t Allow"
