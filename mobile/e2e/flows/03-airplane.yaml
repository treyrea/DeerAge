appId: com.vibecode.deerage-qj3cfq
---
- launchApp
- runFlow: dismiss-location.yaml
- scrollUntilVisible:
    element:
      text: ".*Age My Deer.*"
    direction: DOWN
    timeout: 40000
    visibilityPercentage: 40
- takeScreenshot: status-bar-network
- scrollUntilVisible:
    element:
      id: e2e-offline
    direction: UP
    timeout: 15000
    visibilityPercentage: 40
- tapOn:
    id: e2e-offline
- extendedWaitUntil:
    visible: ".*No Signal.*"
    timeout: 10000
- takeScreenshot: no-signal
